# Modello di mkdocs.yml: la nav dei capitoli la inserisce genera_sito.py.
# Non modificare mkdocs.yml a mano: si modifica questo file e si rigenera.
site_name: Algebra Lineare · Fabio Furini
site_description: >-
  Algebra Lineare: la dispensa del corso online, con definizioni,
  esempi svolti, esercizi e un laboratorio di calcolo interattivo
  (Gauss, determinanti, inverse, sistemi lineari, fattorizzazione LU).
site_author: Fabio Furini
site_url: https://fabiofurini.github.io/algebra-lineare/
repo_url: https://github.com/fabiofurini/algebra-lineare
copyright: >-
  &copy; 2026 Fabio Furini — testi, figure e dati con licenza
  <a href="https://creativecommons.org/licenses/by/4.0/deed.it">CC BY 4.0</a>,
  codice con licenza
  <a href="https://github.com/fabiofurini/algebra-lineare/blob/main/LICENSE-CODE">MIT</a>

theme:
  name: material
  language: it
  icon:
    logo: material/matrix
  font:
    text: Source Sans 3
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/weather-night
        name: Tema scuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Tema chiaro
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search:
      lang: it

extra:
  social:
    - icon: material/web
      link: https://fabiofurini.github.io/
      name: Fabio Furini — sito personale
    - icon: material/school
      link: https://www.diag.uniroma1.it/
      name: DIAG — Sapienza Università di Roma
    - icon: fontawesome/brands/github
      link: https://github.com/fabiofurini
      name: GitHub
    - icon: material/function-variant
      link: https://fabiofurini.github.io/analisi-matematica-1/
      name: Analisi Matematica 1
    - icon: material/code-braces
      link: https://fabiofurini.github.io/algoritmi/
      name: Algoritmi
    - icon: material/vector-triangle
      link: https://fabiofurini.github.io/programmazione-lineare/
      name: Programmazione lineare
    - icon: material/dots-grid
      link: https://fabiofurini.github.io/programmazione-lineare-intera/
      name: Programmazione lineare intera
    - icon: material/vector-curve
      link: https://fabiofurini.github.io/ottimizzazione-convessa/
      name: Ottimizzazione convessa
    - icon: material/graph-outline
      link: https://fabiofurini.github.io/ottimizzazione-su-reti/
      name: Ottimizzazione su reti
    - icon: material/hexagon-multiple-outline
      link: https://fabiofurini.github.io/ottimizzazione-combinatoria/
      name: Problemi di ottimizzazione combinatoria
    - icon: material/table-large
      link: https://fabiofurini.github.io/programmazione-dinamica/
      name: Programmazione dinamica
    - icon: material/map-marker-path
      link: https://fabiofurini.github.io/algoritmi-euristici/
      name: Algoritmi euristici
    - icon: material/approximately-equal
      link: https://fabiofurini.github.io/algoritmi-di-approssimazione/
      name: Algoritmi di approssimazione
    - icon: material/chart-line
      link: https://fabiofurini.github.io/modellazione-pl/
      name: Modellazione PL
    - icon: material/chart-bell-curve-cumulative
      link: https://fabiofurini.github.io/modellazione-pnl/
      name: Modellazione PNL
    - icon: material/vector-polygon
      link: https://fabiofurini.github.io/modellazione-mip/
      name: Modellazione MIP
  alternate:
    - name: Italiano
      link: https://fabiofurini.github.io/algebra-lineare/
      lang: it
    - name: English
      link: https://fabiofurini.github.io/linear-algebra/
      lang: en

extra_css:
  - stylesheets/collana.css
  - stylesheets/extra.css?v=6b95240421
  - stylesheets/laboratorio.css?v=58ef6c75c0
  - stylesheets/quiz.css?v=9e3792b41c

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true
  - footnotes
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      title: In questa pagina
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/collana.js?v=4f68d7e6a2
  - javascripts/cloudflare-analytics.js?v=913760528a
  - javascripts/mathjax.js?v=2617f92aed
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/algebra.js?v=351bd892dc
  - javascripts/laboratorio.js?v=05752f3de5
  - javascripts/quiz.js?v=be7fae2b85

# le pagine delle singole app non stanno nel menu: si raggiungono dall'indice del laboratorio
not_in_nav: |
  /laboratorio/*.md
  !/laboratorio/index.md

nav:
  - Home: index.md
  - Somme e produttorie:
      - somme/index.md
      - "1. Sommatorie": somme/01-sommatorie.md
      - "2. Produttorie": somme/02-produttorie.md
  - Vettori e matrici:
      - vettori-matrici/index.md
      - "3. Vettori": vettori-matrici/01-vettori.md
      - "4.1. Matrici": vettori-matrici/02-matrici.md
      - "4.2. Operazioni sulle matrici": vettori-matrici/03-operazioni-elementari.md
      - "4.3. Inversione di matrici": vettori-matrici/04-matrice-inversa.md
      - "4.4. Fattorizzazione di matrici": vettori-matrici/05-fattorizzazione-lu.md
      - "4.5. Autovalori e autovettori": vettori-matrici/06-autovalori.md
  - Norme: norme/01-norme.md
  - Sistemi lineari: sistemi/01-sistemi-lineari.md
  - Approfondimenti:
      - approfondimenti/index.md
      - "A.1. Valore assoluto": approfondimenti/01-valore-assoluto.md
      - "A.2. Aritmetica modulare": approfondimenti/02-aritmetica-modulare.md
  - Esercizi:
      - esercizi/index.md
      - Somme e produttorie:
          - "1. Sommatorie": esercizi/es-somme-01-sommatorie.md
          - "2. Produttorie": esercizi/es-somme-02-produttorie.md
      - Vettori e matrici:
          - "3. Vettori": esercizi/es-vettori-matrici-01-vettori.md
          - "4.1. Matrici": esercizi/es-vettori-matrici-02-matrici.md
          - "4.2. Operazioni sulle matrici": esercizi/es-vettori-matrici-03-operazioni-elementari.md
          - "4.3. Inversione di matrici": esercizi/es-vettori-matrici-04-matrice-inversa.md
          - "4.4. Fattorizzazione di matrici": esercizi/es-vettori-matrici-05-fattorizzazione-lu.md
          - "4.5. Autovalori e autovettori": esercizi/es-vettori-matrici-06-autovalori.md
      - Norme:
          - "5. Norme": esercizi/es-norme-01-norme.md
      - Sistemi lineari:
          - "6. Sistemi di equazioni lineari": esercizi/es-sistemi-01-sistemi-lineari.md
      - Approfondimenti:
          - "A.1. Valore assoluto": esercizi/es-approfondimenti-01-valore-assoluto.md
          - "A.2. Aritmetica modulare": esercizi/es-approfondimenti-02-aritmetica-modulare.md
  - Quiz: autovalutazione.md
  - Laboratorio: laboratorio/index.md
  - Materiale: materiale.md
  - Indice:
      - Indice completo: indice.md
      - Come si lavora con il corso: organizzazione.md
